<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Gram Growth Journey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Green Gram Growth Journey</h1>
    <p>Click on any day to hear the audio guide!</p>

    <!-- The 3x3 grid -->
    <div class="grid-container">
        <!-- Notice the 'data-day' attribute added to each item -->
        <div class="grid-item" data-day="1"><img src="day1.png" alt="Day 1"></div>
        <div class="grid-item" data-day="2"><img src="day2.png" alt="Day 2"></div>
        <div class="grid-item" data-day="3"><img src="day3.png" alt="Day 3"></div>
        <div class="grid-item" data-day="4"><img src="day4.png" alt="Day 4"></div>
        <div class="grid-item" data-day="5"><img src="day5.png" alt="Day 5"></div>
        <div class="grid-item" data-day="6"><img src="day6.png" alt="Day 6"></div>
        <div class="grid-item" data-day="7"><img src="day7.png" alt="Day 7"></div>
        <div class="grid-item" data-day="8"><img src="day8.png" alt="Day 8"></div>
        <div class="grid-item" data-day="9"><img src="day9.png" alt="Day 9"></div>
    </div>

    <!-- We no longer need 9 separate audio elements here! -->
    <!-- JavaScript will create and play them dynamically on the fly. -->

    <script src="script.js"></script>
</body>
</html>
